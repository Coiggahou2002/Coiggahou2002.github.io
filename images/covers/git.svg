<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="git">
<style>
text{font-family:"Chalkboard SE","Comic Sans MS",cursive;font-weight:300;fill:#1d1d1d}
.b{stroke:#1d1d1d;stroke-width:2.2;stroke-linejoin:round}
.d{stroke-dasharray:8 6}
.a{stroke:#e03131;stroke-width:2.6;fill:none;marker-end:url(#h)}
.a2{stroke:#1971c2;stroke-width:2.6;fill:none;marker-end:url(#h2)}
.t1{font-size:21px;font-weight:400} .t2{font-size:17px} .t3{font-size:14px;fill:#6b6b6b}
.r{font-size:16px;fill:#e03131} .bl{font-size:16px;fill:#1971c2} .m{font-family:Menlo,monospace;font-size:15px}
</style>
<defs>
<filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="h2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
</defs>
<rect width="480" height="300" fill="#fbfbf8"/>
<g filter="url(#w)"><path class="b" d="M40,180 L440,180" fill="none"/><path class="b" d="M160,180 C190,100 220,100 250,100 L330,100 C360,100 380,160 400,180" fill="none"/><circle class="b" cx="70" cy="180" r="13" fill="#dcfce7"/><circle class="b" cx="130" cy="180" r="13" fill="#dcfce7"/><circle class="b" cx="200" cy="180" r="13" fill="#dcfce7"/><circle class="b" cx="300" cy="180" r="13" fill="#dcfce7"/><circle class="b" cx="400" cy="180" r="13" fill="#dcfce7"/><circle class="b" cx="250" cy="100" r="13" fill="#dbeafe"/><circle class="b" cx="320" cy="100" r="13" fill="#dbeafe"/><text class="t3" x="40" y="230" text-anchor="start">main</text><text class="t3" x="250" y="70" text-anchor="middle">feature</text><text class="r" x="400" y="225" text-anchor="middle">merge</text></g></svg>
