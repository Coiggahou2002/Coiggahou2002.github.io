<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="slimmer, cached builds">
<style>
text{font-family:"Chalkboard SE","Comic Sans MS",cursive;font-weight:300;fill:#1d1d1d}
.b{stroke:#1d1d1d;stroke-width:2.2;stroke-linejoin:round}
.d{stroke-dasharray:8 6}
.a{stroke:#e03131;stroke-width:2.6;fill:none;marker-end:url(#h)}
.a2{stroke:#1971c2;stroke-width:2.6;fill:none;marker-end:url(#h2)}
.t1{font-size:21px;font-weight:400} .t2{font-size:17px} .t3{font-size:14px;fill:#6b6b6b}
.r{font-size:16px;fill:#e03131} .bl{font-size:16px;fill:#1971c2} .m{font-family:Menlo,monospace;font-size:15px}
</style>
<defs>
<filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
<marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="h2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
</defs>
<rect width="480" height="300" fill="#fbfbf8"/>
<g filter="url(#w)"><text class="t3" x="40" y="50" text-anchor="start">Docker image</text><rect class="b" x="40" y="200" width="190" height="50" rx="10" fill="#dcfce7"/><text class="t2" x="135" y="231" text-anchor="middle">node:20-slim</text><rect class="b" x="40" y="140" width="190" height="50" rx="10" fill="#dbeafe"/><text class="t3" x="135" y="171" text-anchor="middle">node_modules (cached)</text><rect class="b" x="40" y="80" width="190" height="50" rx="10" fill="#fef3c7"/><text class="t2" x="135" y="111" text-anchor="middle">app build</text><text class="t3" x="360" y="50" text-anchor="middle">image size</text><rect class="b" x="300" y="90" width="50" height="160" rx="10" fill="#ffe3e3"/><rect class="b" x="380" y="170" width="50" height="80" rx="10" fill="#dcfce7"/><path class="b" d="M290,250 L444,250" fill="none"/><text class="r" x="405" y="160" text-anchor="middle">−50%</text><text class="t3" x="360" y="282" text-anchor="middle">npm prune --production</text></g><path class="a" d="M352,110 C380,110 400,130 405,142"/></svg>
